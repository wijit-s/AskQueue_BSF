<ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="medium" color="#fff" type="square-jelly-box" [fullScreen]="false">
    <p style="color: white"> Loading... </p>
</ngx-spinner>
<div class="wrapper">
    <app-sidebar></app-sidebar>
    <div class="main-panel">
        <app-header></app-header>
        <div class="content">
            <!-- container-fluid -->
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-11">
                        <div class="card">
                            <div class="card-body">

                                <!-- 
                        <button class="btn btn-success btn-sm" (click)="OpenBarcodeScan()">เปิดแสกน</button>
                        <button class="btn btn-danger btn-sm" (click)="CloseBarcodeScan()">ปิดแสกน</button>

                        <barcode-scanner-livestream
                        type="code_39"
                        (valueChanges)="onValueChanges($event)"
                        (started)="(onStarted)"></barcode-scanner-livestream>
                      <div [hidden]="!barcodeValue">
                        {{ barcodeValue }}
                      </div> 
                      -->

                                <form [formGroup]="FormOne" (ngSubmit)="UpdateQueue()" novalidate>
                                    <div class="input-group mb-3">
                                        <span class="input-group-text" id="basic-addon1">
                                            Barcode คิวอ้อยทางไกล
                                        </span>
                                        <input autofocus type="text" maxlength="10" formControlName="zeroqrcodedata"
                                            class="form-control" (input)="onKey($event)"
                                            (change)="Loadqonline(barcode)">

                                        <!-- validation message -->
                                        <div *ngIf="FormOne.get('zeroqrcodedata')?.invalid && (FormOne.get('zeroqrcodedata')?.touched || FormOne.get('zeroqrcodedata')?.dirty)"
                                            class="text-danger small mt-1">
                                            <div *ngIf="FormOne.get('zeroqrcodedata')?.errors?.required">กรุณาใส่
                                                Barcode</div>
                                            <div *ngIf="FormOne.get('zeroqrcodedata')?.errors?.minlength">Barcode
                                                ต้องมีอย่างน้อย 10 ตัวอักษร</div>
                                        </div>

                                    </div>
                                    <div class="input-group mb-3">
                                        <!-- <p>barcode: {{ barcode }}</p>  -->
                                    </div>
                                    <div class="input-group mb-3">
                                        <span class="input-group-text">
                                            1.โควตาชาวไร่ :
                                        </span>
                                        <input type="text" list="farmer21" class="form-control"
                                            formControlName="onefmcode" (change)="onSelect(2)" (input)="onSelect(2)">
                                        <datalist id="farmer21">
                                            <option *ngFor="let item of farmerzone21" [value]="item.fmcode_b1">
                                                {{item.fmcode_b1}}:{{item.fmname}} , โซน {{item.SUPZONE}}</option>
                                        </datalist>
                                        <div *ngIf="FormOne.get('onefmcode')?.invalid && (FormOne.get('onefmcode')?.touched || FormOne.get('onefmcode')?.dirty)"
                                            class="text-danger small mt-1">
                                            <div *ngIf="FormOne.get('onefmcode')?.errors?.required">
                                                กรุณาเลือกหรือกรอกโควตาชาวไร่</div>
                                        </div>
                                    </div>
                                    <div class="input-group mb-3">
                                        <span class="input-group-text">
                                            2.ทะเบียนรถ :
                                        </span>
                                        <input type="text" class="form-control" formControlName="twotruckreg"
                                            (change)="onSelect(3)" (input)="onSelect(3)"
                                            placeholder="เลือกทะเบียนรถ รหัสรถ 10 หลัก" list="Truckdata">
                                        <datalist id="Truckdata">
                                            <option *ngFor="let item of truckdata" [value]="item.TRUCK_NO">
                                                {{item.TRUCK_NO}}, {{item.REGTRUCK}} - {{item.FMname}}</option>
                                        </datalist>
                                        <div *ngIf="FormOne.get('twotruckreg')?.invalid && (FormOne.get('twotruckreg')?.touched || FormOne.get('twotruckreg')?.dirty)"
                                            class="text-danger small mt-1">
                                            <div *ngIf="FormOne.get('twotruckreg')?.errors?.required">
                                                กรุณาเลือกหรือกรอกทะเบียนรถ</div>
                                        </div>
                                    </div>

                                    <div class="input-group mb-3">
                                        <button type="submit" class="btn btn-info"
                                            [disabled]="FormOne.invalid || (FormOne.get('zeroqrcodedata')?.value?.length < 10)">บันทึก</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <table class="table" *ngFor="let item of farqrdata">
                            <tr>
                                <td> ใบคิว</td>
                                <td>{{item.truck_q}} </td>
                            </tr>
                            <tr>
                                <td> เจ้าของอ้อย</td>
                                <td>{{item.fmname}} </td>
                            </tr>
                            <tr>
                                <td> </td>
                                <td>{{item.f}} </td>
                            </tr>

                        </table>
                    </div>
                </div>
            </div>
            <!-- container-fluid -->
        </div>
        <app-footer></app-footer>
    </div>
    <!--<app-canclequeue></app-canclequeue>-->
</div>

<!-- Modal -->
<div class="modal fade" id="showqueue" tabindex="-1" role="dialog" aria-labelledby="exampleModalScrollableTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalScrollableTitle">ลำดับคิว</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                นำคิวนี้ไปเขียนบนบัตร : {{this.forwardqrun + 1}}
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
